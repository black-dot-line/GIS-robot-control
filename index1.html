    async function toggleRobotMotion() {
      if (isRobotBusy) return;
      isRobotBusy = true;
      robotToggleBtn.disabled = true;

      try {
        if (isRobotRunning) {
          cancelAutoMotionSelection();
          stopMoveDirection();
          await waitForMovementRequests();
          const data = await postOnly("/api/robot_stop");
          setObstacleAvoidanceState({ enabled: false, active: false });
          setRobotRunningState(false);
          setStreamStatus(data.message || "机器人已停止");
        } else {
          const data = await postOnly("/api/robot_start");
          setRobotRunningState(true);
          setStreamStatus(data.message || "机器人已启动");
        }
      } catch (e) {
        console.error("toggleRobotMotion error:", e);
        setStreamStatus(`运动控制失败：${e.message || e}`);
      } finally {
        isRobotBusy = false;
        robotToggleBtn.disabled = false;
        await loadStatus();
      }
    }

    function enqueueMovementRequest(task, generation) {
      const run = movementRequestChain
        .catch(() => null)
        .then(() => {
          if (generation !== movementRequestGeneration) return null;
          return task();
        });

      movementRequestChain = run.catch(() => null);
      return run;
    }

    function waitForMovementRequests() {
      return movementRequestChain.catch(() => null);
    }

    function invalidateMovementRequests() {
      movementRequestGeneration += 1;
      return movementRequestGeneration;
    }

    function cancelAutoMotionSelection() {
      autoMotionRequestId += 1;
    }

    function sendDirectionCommand(direction) {
      currentDirection = direction;
      const generation = movementRequestGeneration;

      return enqueueMovementRequest(async () => {
        const body = { direction };

        if (direction === "left" || direction === "right") {
          body.turnScale = TURN_SCALE;
        }

        return postJson("/api/move", body);
      }, generation).catch((e) => {
        console.error("sendDirectionCommand error:", e);
        setStreamStatus(`方向控制失败：${e.message || e}`);
        return null;
      });
    }

    function stopDirectionCommand() {
      currentDirection = null;
      const generation = movementRequestGeneration;
      return enqueueMovementRequest(() => postOnly("/api/move_stop"), generation)
        .catch((e) => {
        console.error("stopDirectionCommand error:", e);
        setStreamStatus(`停止控制失败：${e.message || e}`);
        return null;
      });
    }

    function startMoveDirection(direction, buttonEl, sendStopBeforeStart = false) {
      if (!canMoveDirection(direction)) return;

      if (currentDirection === direction && directionRunning) return;

      stopMoveDirection(sendStopBeforeStart);

      directionRunning = true;
      currentDirection = direction;
      directionButton = buttonEl || null;

      if (directionButton) directionButton.classList.add("holding");

      sendDirectionCommand(direction);

      directionTimer = setInterval(() => {
        sendDirectionCommand(direction);
      }, 260);
    }

    function stopMoveDirection(sendStop = true) {
      invalidateMovementRequests();

      if (directionTimer) {
        clearInterval(directionTimer);
        directionTimer = null;
      }

      if (directionButton) {
        directionButton.classList.remove("holding");
        directionButton = null;
      }

      const hadDirection = directionRunning || currentDirection;
      if (hadDirection) {
        directionRunning = false;
        currentDirection = null;
        if (sendStop) {
          stopDirectionCommand();
        }
      }
    }

    async function handleStopDirection(buttonEl) {
      if (!canUseStopButton()) return;

      if (buttonEl) {
        buttonEl.classList.add("holding");
        setTimeout(() => {
          buttonEl.classList.remove("holding");
        }, 140);
      }

      if (isObstacleAvoidanceEnabled) {
        await stopObstacleAvoidance();
        return;
      }

      if (directionTimer || directionRunning || currentDirection) {
        cancelAutoMotionSelection();
        stopMoveDirection();
        setStreamStatus("机器人已停止移动");
        return;
      }

      cancelAutoMotionSelection();
      invalidateMovementRequests();
      const data = await stopDirectionCommand();
      setStreamStatus((data && data.message) || "机器人已停止移动");
    }

    async function handleAutoMotionPress(direction, buttonEl) {
      const action = {
        forward: { mode: "straight", travel: "forward" },
        backward: { mode: "straight", travel: "backward" },
      }[direction];

      if (!action || !canMoveDirection(direction)) return;

      if (autoMotionMode === action.mode && currentDirection === action.travel && directionRunning) {
        return;
      }

      // Remove the old watchdog without racing it against the new forward command.
      stopMoveDirection(false);
      const requestId = ++autoMotionRequestId;

      try {
        const data = await postJson("/api/auto_motion_mode", { mode: action.mode });
        if (requestId !== autoMotionRequestId || controlMode !== "auto" || !isRobotRunning) return;
        autoMotionMode = AUTO_MOTION_LABELS[data.auto_motion_mode]
          ? data.auto_motion_mode
          : action.mode;

        startMoveDirection(action.travel, buttonEl, false);
        updateControlModeUI();
        setStreamStatus(`自动模式：${AUTO_MOTION_LABELS[autoMotionMode]}持续运行中`);
      } catch (e) {
        if (requestId !== autoMotionRequestId || controlMode !== "auto" || !isRobotRunning) return;
        console.error("handleAutoMotionPress error:", e);
        setStreamStatus(`自动轨迹选择失败：${e.message || e}`);
      }
    }

    async function handleDirectionPress(direction, buttonEl) {
      if (isObstacleAvoidanceEnabled) return;
      if (!canMoveDirection(direction)) return;

      if (controlMode === "auto") {
        await handleAutoMotionPress(direction, buttonEl);
        return;
      }

      startMoveDirection(direction, buttonEl);
    }


    function handleDirectionRelease() {
      if (controlMode === "auto") return;
      stopMoveDirection();
    }

    async function changeFanSpeed(delta) {
      try {
        const nextFanSpeed = Math.max(FAN_MIN, Math.min(FAN_MAX, currentFanSpeed + delta));
        const actualDelta = nextFanSpeed - currentFanSpeed;

        if (actualDelta === 0) {
          fanSpeedValue.textContent = currentFanSpeed;
          setStreamStatus(`风扇速度已到边界：${currentFanSpeed}`);
          return;
        }

        const data = await postJson("/api/fan_speed_step", { delta: actualDelta });

        if (typeof data.fan_speed !== "undefined") {
          currentFanSpeed = Math.max(FAN_MIN, Math.min(FAN_MAX, Number(data.fan_speed) || 0));
          fanSpeedValue.textContent = currentFanSpeed;
        } else {
          currentFanSpeed = nextFanSpeed;
          fanSpeedValue.textContent = currentFanSpeed;
        }

        setStreamStatus(data.message || "机器人风扇速度已更新");
      } catch (e) {
        console.error("changeFanSpeed error:", e);
        setStreamStatus(`风扇调速失败：${e.message || e}`);
      }
    }

    async function resetFanSpeed() {
      try {
        const data = await postOnly("/api/fan_speed_reset");
        currentFanSpeed = typeof data.fan_speed !== "undefined"
          ? Math.max(FAN_MIN, Math.min(FAN_MAX, Number(data.fan_speed) || 0))
          : 0;

        fanSpeedValue.textContent = currentFanSpeed;
        setStreamStatus(data.message || "机器人风扇速度已重置");
      } catch (e) {
        console.error("resetFanSpeed error:", e);
        setStreamStatus(`风扇重置失败：${e.message || e}`);
      }
    }


    function setGimbalUiStatus(message, state = "ready") {
      const safeMessage = String(message || "");

      if (gimbalUiStatus) {
        gimbalUiStatus.textContent = safeMessage;
      }

      if (gimbalLinkState) {
        const labels = {
          checking: "连接检测",
          connected: "云台已连接",
          ready: "控制就绪",
          warning: "姿态异常",
          moving: "执行中",
          stopping: "正在停止",
          error: "控制异常"
        };
        gimbalLinkState.textContent = labels[state] || labels.ready;
        gimbalLinkState.dataset.state = state;
        gimbalLinkState.title = safeMessage;
      }
    }

    function applyGimbalConnectionState(gimbal = {}, fallbackMessage = "") {
      const tcpReachable = (
        typeof gimbal.tcp_reachable !== "undefined"
          ? !!gimbal.tcp_reachable
          : !!gimbal.connected
      );

      const controlReady = !!gimbal.control_ready;
      const tcpError = String(gimbal.tcp_error || "");
      const controlError = String(
        gimbal.control_error || gimbal.last_error || ""
      );

      const modeText = gimbal.mode_name
        ? `（${gimbal.mode_name}）`
        : "";

      if (!tcpReachable) {
        setGimbalUiStatus(
          `云台 TCP 未连接：${tcpError || controlError || fallbackMessage || "请检查 IP、端口和网络"}`,
          "error"
        );
        return;
      }

      // 只有当前控制状态确实未恢复时，才显示“控制异常”。
      if (controlError && gimbal.control_ready === false) {
        setGimbalUiStatus(
          `云台已连接${modeText}，但控制尚未恢复：${controlError}`,
          "error"
        );
        return;
      }

      // 历史 pose_error 不参与普通状态轮询。
      // 姿态异常只在用户主动点击“读取姿态”时提示，
      // 避免姿态查询问题污染已经稳定的方向控制状态。
      if (controlReady) {
        setGimbalUiStatus(
          `云台连接正常${modeText}，控制就绪。`,
          "ready"
        );
      } else if (gimbal.busy) {
        setGimbalUiStatus(
          `云台已连接${modeText}，正在执行控制动作。`,
          "moving"
        );
      } else {
        setGimbalUiStatus(
          `G1 TCP 已连接${modeText}，可进行云台控制。`,
          "connected"
        );
      }
    }

    let gimbalLastPose = null;

    function updateGimbalPose(pose = {}) {
      if (!pose || typeof pose !== "object") return;
      gimbalLastPose = { ...pose };
    }

    function updateGimbalPoseFromData(data = {}) {
      const pose = data.gimbal_pose
        || data.pose
        || (data.gimbal && data.gimbal.pose)
        || null;

      if (pose && typeof pose === "object") {
        updateGimbalPose(pose);
      }
    }

    function clampGimbalSpeed(value) {
      const parsed = Math.round(Number(value));
      if (!Number.isFinite(parsed)) return gimbalSpeed;
      return Math.max(1, Math.min(128, parsed));
    }

    function syncGimbalSpeedFromSlider(value) {
      gimbalSpeed = clampGimbalSpeed(value);
      if (gimbalSpeedSlider) gimbalSpeedSlider.value = String(gimbalSpeed);
      if (gimbalSpeedInput) gimbalSpeedInput.value = String(gimbalSpeed);
    }

    function syncGimbalSpeedFromInput(value) {
      syncGimbalSpeedFromSlider(value);
    }

    function getGimbalDirectionLabel(axis, direction) {
      const labels = {
        yaw: direction < 0 ? "左转" : "右转",
        pitch: direction < 0 ? "低头" : "抬头"

      return labels[axis] || "云台运动";
    }

    function setGimbalControlsDisabled(disabled) {
      document.querySelectorAll(".gimbal-jog-btn").forEach((button) => {
        button.disabled = !!disabled;
      });

      const readButton = document.querySelector(".gimbal-read-btn");
      const resetButton = document.querySelector(".gimbal-header-reset");
      if (readButton) readButton.disabled = !!disabled;
      if (resetButton) resetButton.disabled = !!disabled;
    }

    function setGimbalAuxControlsDisabled(disabled) {
      const readButton = document.querySelector(".gimbal-read-btn");
      const resetButton = document.querySelector(".gimbal-header-reset");
      if (readButton) readButton.disabled = !!disabled;
      if (resetButton) resetButton.disabled = !!disabled;
    }

    function gimbalSleep(ms) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, Math.max(0, Number(ms) || 0));
      });
    }

    async function gimbalApiRequest(url, options = {}) {
      const controller = new AbortController();
      const callerSignal = options.signal || null;
      const timeoutMs = Number(options.timeoutMs || GIMBAL_API_TIMEOUT_MS);

      let callerAbortHandler = null;
      if (callerSignal) {
        if (callerSignal.aborted) {
          controller.abort();
        } else {
          callerAbortHandler = () => controller.abort();
          callerSignal.addEventListener("abort", callerAbortHandler, {
            once: true
          });
        }
      }

      const timer = window.setTimeout(() => {
        controller.abort();
      }, Math.max(1000, timeoutMs));

      try {
        const fetchOptions = {
          cache: "no-store",
          ...options,
          signal: controller.signal
        };
        delete fetchOptions.timeoutMs;

        const response = await fetch(url, fetchOptions);
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          const error = new Error(
            data.message || `请求失败（HTTP ${response.status}）`
          );
          error.data = data;
          error.httpStatus = response.status;
          throw error;
        }

        return data;

      } catch (error) {
        if (error && error.name === "AbortError") {
          const timeoutError = new Error(
            `云台请求超过 ${Math.round(timeoutMs / 1000)} 秒未完成`
          );
          timeoutError.data = {
            ok: false,
            timeout: true
          };
          throw timeoutError;
        }
        throw error;

      } finally {
        window.clearTimeout(timer);
        if (callerSignal && callerAbortHandler) {
          callerSignal.removeEventListener(
            "abort",
            callerAbortHandler
          );
        }
      }
    }

    function getGimbalQueuedCount() {
      return gimbalCommandQueue.length + (gimbalQueueRunning ? 1 : 0);
    }

    function clearPendingGimbalCommands() {
      gimbalCommandQueue.length = 0;
    }

    async function executeQueuedGimbalCommand(item, generation) {
      const {
        axis,
        direction,
        buttonEl,
        speed
      } = item;

      const label = getGimbalDirectionLabel(axis, direction);

      gimbalActiveButton = buttonEl || null;
      if (gimbalActiveButton) {
        gimbalActiveButton.classList.add("holding");
      }

      if (generation === gimbalUiGeneration) {
        setGimbalUiStatus(
          `正在执行${label}，速度 ${speed}/128；动作结束后自动停止。`,
          "moving"
        );
      }

      try {
        const data = await gimbalApiRequest("/api/gimbal/jog/pulse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            axis,
            direction,
            speed,
            duration_ms: 250
          })
        });

        if (generation !== gimbalUiGeneration) {
          return;
        }

        // 控制动作不再自动查询姿态；只有服务端明确声明 pose_fresh
        // 才用返回值刷新角度，避免把旧缓存当成实时姿态。
        if (data.pose_fresh) {
          updateGimbalPoseFromData(data);
        }

        const message = data.interrupted
          ? `${label}已被停止，控制就绪。`
          : (data.message || `${label}完成，控制就绪。`);

        setGimbalUiStatus(message, "ready");

      } catch (error) {
        console.error("executeQueuedGimbalCommand error:", error);

        if (generation !== gimbalUiGeneration) {
          return;
        }

        const payload = error && error.data ? error.data : {};
        const gimbal = payload.gimbal || {};
        const tcpReachable = (
          typeof gimbal.tcp_reachable !== "undefined"
            ? !!gimbal.tcp_reachable
            : !!gimbal.connected
        );

        if (payload.recovered && tcpReachable) {
          setGimbalUiStatus(
            `本次${label}未确认，但后端已自动 Stop 并恢复；可以继续控制。`,
            "warning"
          );
        } else if (payload.timeout) {
          clearPendingGimbalCommands();
          setGimbalUiStatus(
            `本次${label}请求超时，正在自动执行安全停止。`,
            "warning"
          );
          window.setTimeout(() => {
            stopGimbalJog(false).catch((stopError) => {
              console.error("automatic safety stop error:", stopError);
            });
          }, 0);
        } else {
          clearPendingGimbalCommands();
          setGimbalUiStatus(
            `控制异常：${error.message || error}；正在自动尝试停止。`,
            "error"
          );
          window.setTimeout(() => {
            stopGimbalJog(false).catch((stopError) => {
              console.error("automatic safety stop error:", stopError);
            });
          }, 0);
        }

      } finally {
        if (gimbalActiveButton === buttonEl && gimbalActiveButton) {
          gimbalActiveButton.classList.remove("holding");
          gimbalActiveButton = null;
        }
      }
    }

    async function drainGimbalCommandQueue() {
      if (gimbalQueueRunning || gimbalStopInFlight) {
        return;
      }

      gimbalQueueRunning = true;
      gimbalBusy = true;
      setGimbalAuxControlsDisabled(true);

      try {
        while (
          gimbalCommandQueue.length > 0
          && !gimbalStopInFlight
        ) {
          const item = gimbalCommandQueue.shift();
          const generation = gimbalUiGeneration;

          await executeQueuedGimbalCommand(item, generation);
          gimbalLastCommandFinishedAt = Date.now();

          if (
            generation !== gimbalUiGeneration
            || gimbalStopInFlight
          ) {
            break;
          }

          const elapsed = Date.now() - gimbalLastCommandFinishedAt;
          const remaining = Math.max(
            0,
            GIMBAL_CLIENT_GAP_MS - elapsed
          );
          if (remaining > 0) {
            await gimbalSleep(remaining);
          }
        }

      } finally {
        gimbalQueueRunning = false;

        if (!gimbalStopInFlight) {
          gimbalBusy = false;
          setGimbalAuxControlsDisabled(false);
        }

        // 若等待期间又有新点击，继续按串行顺序处理。
        if (
          gimbalCommandQueue.length > 0
          && !gimbalStopInFlight
        ) {
          drainGimbalCommandQueue().catch((error) => {
            console.error("restart gimbal queue error:", error);
          });
        }
      }
    }

    function jogGimbalOnce(axis, direction, buttonEl) {
      if (gimbalStopInFlight) {
        setGimbalUiStatus(
          "正在停止云台，请等待停止完成后再继续。",
          "stopping"
        );
        return;
      }

      const normalizedDirection = Number(direction) < 0 ? -1 : 1;
      const label = getGimbalDirectionLabel(
        axis,
        normalizedDirection
      );

      if (gimbalCommandQueue.length >= GIMBAL_MAX_PENDING_COMMANDS) {
        setGimbalUiStatus(
          `点击过快：已有 ${GIMBAL_MAX_PENDING_COMMANDS} 条控制指令等待执行，为避免云台过载，本次点击已忽略。`,
          "warning"
        );
        return;
      }

      if (axis !== "yaw" && axis !== "pitch") {
        setGimbalUiStatus("当前页面只保留抬头、低头、左转、右转控制。", "warning");
        return;
      }

      gimbalCommandQueue.push({
        axis,
        direction: normalizedDirection,
        buttonEl: buttonEl || null,
        speed: gimbalSpeed
      });

      if (gimbalQueueRunning) {
        setGimbalUiStatus(
          `${label}已进入串行队列，当前等待 ${gimbalCommandQueue.length} 条。`,
          "moving"
        );
      }

      drainGimbalCommandQueue().catch((error) => {
        console.error("drainGimbalCommandQueue error:", error);
        gimbalBusy = false;
        gimbalQueueRunning = false;
        setGimbalAuxControlsDisabled(false);
        setGimbalUiStatus(
          `云台队列异常：${error.message || error}`,
          "error"
        );
      });
    }

    async function stopGimbalJog(forceMessage = false) {
      if (gimbalStopInFlight) return;

      // Stop 会使所有“旧控制请求”的迟到响应失效。
      clearPendingGimbalCommands();
      const generation = ++gimbalUiGeneration;

      gimbalStopInFlight = true;
      gimbalBusy = true;
      setGimbalAuxControlsDisabled(true);

      if (forceMessage || gimbalQueueRunning) {
        setGimbalUiStatus("正在执行云台安全停止...", "stopping");
      }

      try {
        const data = await gimbalApiRequest("/api/gimbal/jog/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });

        if (generation === gimbalUiGeneration) {
          if (data.pose_fresh) {
            updateGimbalPoseFromData(data);
          }
          setGimbalUiStatus(
            "云台已停止，队列已清空，控制就绪。",
            "ready"
          );
        }

      } catch (error) {
        console.error("stopGimbalJog error:", error);

        if (generation === gimbalUiGeneration) {
          setGimbalUiStatus(
            `停止异常：${error.message || error}`,
            "error"
          );
        }

      } finally {
        gimbalStopInFlight = false;

        if (!gimbalQueueRunning) {
          gimbalBusy = false;
          setGimbalAuxControlsDisabled(false);
        }
      }
    }

    function sendGimbalStopOnPageExit() {
      const url = "/api/gimbal/jog/stop";
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob(["{}"], { type: "application/json" });
          navigator.sendBeacon(url, blob);
          return;
        }
      } catch (error) {
        console.debug("sendBeacon stop failed:", error);
      }

      try {
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
          keepalive: true
        }).catch(() => {});
      } catch (_) {
        // 页面退出阶段忽略网络异常。
      }
    }

    function updateStreamStatusFromBasic(basic) {
      if (!basic || typeof basic !== "object") return;

      const extras = [];
      if (isRecording || basic.recording_ok) extras.push("录制中");
      if (isDetectionEnabled || basic.foreign_detection_enabled) extras.push("异物识别中");
      if (isCleaning || basic.cleaning_on) extras.push("异物清理中");
      if (isObstacleAvoidanceEnabled || basic.obstacle_avoidance_enabled) extras.push("自动避障运行中");
      if (isRobotRunning || basic.robot_running) extras.push("运动已启动");

      const profileName = {
        "sensor-ultra": "CSI高分辨率档",
        "sensor-balanced": "CSI高分辨率稳态档",
        "ultra-quality": "极致清晰档",
        "max-quality": "极清档",
        "high-quality": "高清档",
        "compatibility": "兼容高清档",
        "safe-hd-plus": "增强720P档",
        "safe-hd": "稳定720P档",
        "safe-original": "原始保底档"
      }[String(basic.stream_profile || "")] || "";

      if (profileName) extras.push(profileName);

      const clientStats = basic.client_video_stats;
      if (clientStats && typeof clientStats === "object") {
        const cw = Number(clientStats.width || 0);
        const ch = Number(clientStats.height || 0);
        const cfps = Number(clientStats.fps || 0);
        const closs = Number(clientStats.packet_loss_pct || 0);

        if (cw > 0 && ch > 0 && cfps > 0) {
          extras.push(
            `Pad ${cw}x${ch}/${cfps.toFixed(1)}FPS/loss ${closs.toFixed(2)}%`
          );
        }
      }

      const guardStatus = String(basic.quality_guard_status || "");
      if (
        basic.quality_guard_enabled &&
        guardStatus &&
        guardStatus !== "正常"
      ) {
        extras.push(`负载保护：${guardStatus}`);
      }

      const extraText = extras.length ? ` | ${extras.join(" | ")}` : "";

      if (basic.stream_ok) {
        const resText = basic.resolution || "";
        const fpsText = String(basic.fps ?? "");
        const bitrate = Number(basic.bitrate_mbps);
        const bitrateText = Number.isFinite(bitrate) ? ` | ${bitrate.toFixed(1)} Mbps` : "";
        const presetText = basic.encoder_preset ? ` | ${basic.encoder_preset}` : "";
        const sharpness = Number(basic.camera_sharpness);
        const sharpnessText = Number.isFinite(sharpness) ? ` | 锐度 ${sharpness.toFixed(2)}` : "";
        const verifiedText = basic.stream_verified ? " | 已验帧" : "";

        if (resText && fpsText) {
          setStreamStatus(
            `视频已接入${extraText} | ${resText} @ ${fpsText} FPS${bitrateText}${presetText}${sharpnessText}${verifiedText}`
          );
        } else {
          setStreamStatus(`视频已接入${extraText}${bitrateText}${presetText}`);
        }
      } else if (basic.stream_error) {
        setStreamStatus(`推流异常：${basic.stream_error}`);
      } else {
        setStreamStatus(`视频状态未知${extraText}`);
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const basic = await res.json();
        handleVideoRecovery(basic);

        if (basic.gimbal_pose && typeof basic.gimbal_pose === "object") {
          updateGimbalPose(basic.gimbal_pose);
        } else if (typeof basic.angle !== "undefined") {
          // 兼容旧版 appV2.py：原单轴角度先显示在俯仰角位置。
          updateGimbalPose({ pitch: basic.angle });
        }

        if (!gimbalBusy && typeof basic.gimbal_connected !== "undefined") {
          applyGimbalConnectionState({
            connected: basic.gimbal_connected,
            tcp_reachable: (
              typeof basic.gimbal_tcp_reachable !== "undefined"
                ? basic.gimbal_tcp_reachable
                : basic.gimbal_connected
            ),
            protocol_ok: basic.gimbal_protocol_ok,
            control_ready: basic.gimbal_control_ready,
            busy: basic.gimbal_busy,
            mode_name: basic.gimbal_mode_name,
            last_error: basic.gimbal_error,
            control_error: basic.gimbal_control_error
          });
        }

        if (typeof basic.recording_ok !== "undefined" && !isRecordingBusy) {
          setRecordingState(!!basic.recording_ok);
        }

        if (typeof basic.foreign_detection_enabled !== "undefined" && !isDetectionBusy) {
          setDetectionState(!!basic.foreign_detection_enabled);
        }

        if (typeof basic.cleaning_on !== "undefined" && !isCleaningBusy) {
          setCleaningState(!!basic.cleaning_on);
        }

        if (typeof basic.robot_running !== "undefined" && !isRobotBusy) {
          setRobotRunningState(!!basic.robot_running);
        }

        if (typeof basic.speed !== "undefined") {
          setSpeedDisplay(Number(basic.speed) || 0);
        }

        if (typeof basic.fan_speed !== "undefined") {
          currentFanSpeed = Math.max(FAN_MIN, Math.min(FAN_MAX, Number(basic.fan_speed) || 0));
          fanSpeedValue.textContent = currentFanSpeed;
        }

        if (typeof basic.control_mode !== "undefined") {
          controlMode = basic.control_mode === "auto" ? "auto" : "manual";
          updateControlModeUI();
        }

        if (typeof basic.auto_motion_mode === "string" && AUTO_MOTION_LABELS[basic.auto_motion_mode]) {
          autoMotionMode = basic.auto_motion_mode;
        }

        if (typeof basic.obstacle_avoidance_enabled !== "undefined" && !isObstacleAvoidanceBusy) {
          setObstacleAvoidanceState({
            enabled: !!basic.obstacle_avoidance_enabled,
            active: !!basic.obstacle_avoidance_active,
            action: basic.obstacle_avoidance_action || "idle",
            direction: basic.obstacle_avoidance_direction || "none",
            left_overlap: !!basic.obstacle_avoidance_left_overlap,
            right_overlap: !!basic.obstacle_avoidance_right_overlap,
            status: basic.obstacle_avoidance_status || "",
            last_error: basic.obstacle_avoidance_error || ""
          }, false);
        }

        updateStreamStatusFromBasic(basic);
      } catch (e) {
        console.error("loadStatus error:", e);
      }
    }

    async function safeShutdown() {
      const ok = confirm("确认执行安全关机吗？\n\n关机后需要重新给树莓派上电才能继续使用。");
      if (!ok) return;

      const shutdownBtn = document.querySelector(".shutdown-btn");

      try {
        if (shutdownBtn) {
          shutdownBtn.disabled = true;
          shutdownBtn.textContent = "正在提交关机请求...";
        }

        const response = await fetch("/api/shutdown", {
          method: "POST",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        if (!response.ok || data.ok === false) {
          throw new Error(
            data.message || `服务器返回错误：HTTP ${response.status}`
          );
        }

        stopStatusPolling();
        alert(data.message || "系统正在安全关机...");

        if (shutdownBtn) {
          shutdownBtn.textContent = "系统正在关机...";
        }
      } catch (e) {
        console.error("safeShutdown error:", e);
        alert(`关机请求失败：${e.message}`);

        if (shutdownBtn) {
          shutdownBtn.disabled = false;
          shutdownBtn.textContent = "安全关机";
        }
      }
    }

    speedInput.addEventListener("change", () => {
      let val = Number(speedInput.value);
      if (Number.isNaN(val)) val = currentSpeed;
      val = Math.max(0, Math.min(0.5, val));
      setSpeed(val);
    });

    speedInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        speedInput.blur();
      }
    });

    videoFrame.addEventListener("loadedmetadata", () => {
      const w = Number(videoFrame.videoWidth || 0);
      const h = Number(videoFrame.videoHeight || 0);

      if (w > 0 && h > 0) {
        setStreamStatus(`视频首帧已到达 | Pad 实际 ${w}x${h}`);
      } else {
        setStreamStatus("视频首帧已到达");
      }

      setTimeout(loadStatus, 300);
    });

    videoFrame.addEventListener("playing", () => {
      streamFailureCount = 0;
    });

    videoFrame.addEventListener("stalled", () => {
      setStreamStatus("视频数据短暂中断，正在等待 WebRTC 恢复...");
    });

    videoFrame.addEventListener("error", () => {
      const message = videoFrame.error
        ? `视频解码错误 ${videoFrame.error.code}`
        : "视频元素错误";

      setStreamStatus(`${message}，正在重新连接...`);
      scheduleWhepReconnect(message);
    });

    videoFallbackFrame.addEventListener("load", () => {
      if (iframeFallbackActive) {
        setStreamStatus("兼容播放器已加载，正在等待 MediaMTX 画面...");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const btn = document.getElementById("fullscreenBtn");
      btn.title = document.fullscreenElement ? "退出全屏" : "全屏查看";
      setTimeout(() => drawDetectionOverlay(latestDetectionData), 80);
    });

    window.addEventListener("resize", () => {
      drawDetectionOverlay(latestDetectionData);
    });

    if (window.ResizeObserver) {
      const detectionResizeObserver = new ResizeObserver(() => {
        drawDetectionOverlay(latestDetectionData);
      });
      detectionResizeObserver.observe(videoFrameWrap);
    }

    window.addEventListener("mouseup", () => {
      handleDirectionRelease();
    });

    window.addEventListener("touchend", () => {
      handleDirectionRelease();
    });

    window.addEventListener("touchcancel", () => {
      handleDirectionRelease();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        sendGimbalStopOnPageExit();
      }
    });

    window.addEventListener("pagehide", () => {
      sendGimbalStopOnPageExit();
      stopDetectionOverlayPolling();
      closeWhepReader(true).catch(() => {});
      if (videoFallbackFrame) videoFallbackFrame.src = "about:blank";
    });

    window.addEventListener("beforeunload", () => {
      sendGimbalStopOnPageExit();
      stopDetectionOverlayPolling();
      closeWhepReader(true).catch(() => {});
      if (videoFallbackFrame) videoFallbackFrame.src = "about:blank";
    });

    updateDateTime();
    setInterval(updateDateTime, 1000);
    setInterval(collectAndReportWebRTCStats, PAD_STATS_INTERVAL_MS);

    window.addEventListener("DOMContentLoaded", async () => {
      updateControlModeUI();
      await connectVideoStream(true);
      await Promise.allSettled([
        loadStatus(),
        initializeGimbalControl()
      ]);
      startDetectionOverlayPolling();
      startStatusPolling();

      const bindMoveButton = (btn, direction) => {
        if (!btn) return;

        btn.addEventListener("mousedown", (e) => {
          if (controlMode !== "manual") return;
          e.preventDefault();
          handleDirectionPress(direction, btn);
        });

        btn.addEventListener("touchstart", (e) => {
          if (controlMode !== "manual") return;
          e.preventDefault();
          handleDirectionPress(direction, btn);
        });

        btn.addEventListener("click", (e) => {
          if (controlMode !== "auto") return;
          e.preventDefault();
          handleDirectionPress(direction, btn);
        });
      };


      bindMoveButton(moveForwardBtn, "forward");
      bindMoveButton(moveLeftBtn, "left");
      bindMoveButton(moveRightBtn, "right");
      bindMoveButton(moveBackwardBtn, "backward");

      if (moveStopBtn) {
        moveStopBtn.addEventListener("click", (e) => {
          e.preventDefault();
          handleStopDirection(moveStopBtn);
        });

        moveStopBtn.addEventListener("touchstart", (e) => {
          if (controlMode === "auto") {
            e.preventDefault();
            handleStopDirection(moveStopBtn);
          }
        });
      }
    });
  </script>
</body>
</html>
